---

- name: ensure service is enabled on boot
  when:
    - not running_in_check_mode
  become: true
  ansible.builtin.service:
    name: forgejo-runner
    state: "{{ forgejo_runner_system_service.state | default('started') }}"
    enabled: "{{ forgejo_runner_system_service.enabled | default(true) | bool }}"

...
