---

- name: merge forgejo-runner configuration between defaults and custom
  when:
    - not running_in_check_mode
  ansible.builtin.set_fact:
    forgejo_runner_config: "{{ forgejo_runner_defaults_config | combine(forgejo_runner_config, recursive=True) }}"

- name: create forgejo-runner directories
  when:
    - not running_in_check_mode
  bodsch.core.directories:
    owner: "{{ forgejo_runner_system_user }}"
    group: "{{ forgejo_runner_system_group }}"
    mode: "0750"
    paths:
      - path: "{{ forgejo_runner_config_dir }}"
      - path: "{{ forgejo_runner_working_dir }}"
        mode: "0770"
      - path: "{{ forgejo_runner_working_dir }}/.token"

- name: validate cache configuration
  when:
    - not running_in_check_mode
    - forgejo_runner_config.cache.enabled | default(false) | bool
  vars:
    _cache_dir: "{{ forgejo_runner_config.cache.dir | default('', true) | string }}"
    _cache_external_server: "{{ forgejo_runner_config.cache.external_server | default('', true) | string }}"
  ansible.builtin.assert:
    that:
      # an empty secret is generated by the runner on every start,
      # an external cache server requires a shared secret
      - forgejo_runner_config.cache | bodsch.scm.validate_runner_secrets(allow_empty=(_cache_external_server | length == 0))
      - _cache_dir | length == 0 or _cache_dir is match('/')
    fail_msg: >-
      invalid cache configuration:
      'secret' must be a 40-character hex string (required when 'external_server' is set),
      'dir' must be an absolute path.
    quiet: true

- name: create forgejo-runner cache directory
  when:
    - not running_in_check_mode
    - forgejo_runner_config.cache.enabled | default(false) | bool
    - forgejo_runner_config.cache.external_server | default('', true) | length == 0
    - forgejo_runner_config.cache.dir | default('', true) | length > 0
  ansible.builtin.file:
    path: "{{ forgejo_runner_config.cache.dir }}"
    state: directory
    owner: "{{ forgejo_runner_system_user }}"
    group: "{{ forgejo_runner_system_group }}"
    mode: "0750"

- name: validate runner secret
  when:
    - not running_in_check_mode
  ansible.builtin.set_fact:
    _valid_runner_secret: "{{ forgejo_runner_register | default([]) | bodsch.scm.validate_runner_secrets() }}"

- name: verify valid runner secret
  when:
    - not running_in_check_mode
  ansible.builtin.assert:
    that:
      - _valid_runner_secret
    msg: The runner secret is not a 40-character hex string
    quiet: true

- name: "persist runner secret"
  ansible.builtin.copy:
    dest: "{{ forgejo_runner_working_dir }}/.token/{{ item.name }}.token"
    content: "{{ item.secret }}"
    owner: "{{ forgejo_runner_system_user }}"
    group: "{{ forgejo_runner_system_group }}"
    mode: "0600"
  loop: "{{ forgejo_runner_register | default([]) }}"
  no_log: true

# - name: d
#   debug:
#     msg:
#       - "{{ forgejo_runner_controller }}"

- name: "create runner token on '{{ forgejo_runner_controller.hostname }}'"
  when:
    - not running_in_check_mode
  remote_user: "{{ forgejo_runner_controller.remoteuser | default(forgejo_runner_controller.username) }}"
  become_user: "{{ forgejo_runner_controller.username }}"
  become: true
  delegate_to: "{{ forgejo_runner_controller.hostname }}"
  run_once: true
  bodsch.scm.forgejo_cli:
    command: register
    config: "{{ forgejo_config_dir }}/forgejo.ini"
    working_dir: "{{ forgejo_working_dir }}"
    runners: "{{ forgejo_runner_register | default([]) }}"
  register: _forgejo_runner_registered

# - name: d
#   debug:
#     msg: "{{ _forgejo_runner_registered }}"

# - name: exit with fail
#   ansible.builtin.fail:
#     msg: A serious error occurred when downloading the archive.

- name: create forgejo-runner configuration
  when:
    - not running_in_check_mode
    # - _forgejo_runner_registered.state.changed | default('false') | bool
  ansible.builtin.template:
    force: true
    src: forgejo-runner/config.yaml.j2
    dest: "{{ forgejo_runner_config_dir }}/config.yaml"
    owner: "{{ forgejo_runner_system_user }}"
    group: "{{ forgejo_runner_system_group }}"
    mode: "0644"
  register: forgejo_runner_config
  notify:
    # - remove dot-runner
    - restart forgejo-runner

- name: remove dot-runner
  when:
    - forgejo_runner_config.changed | default('false') | bool
  become: true
  ansible.builtin.file:
    path: "{{ forgejo_runner_working_dir }}/.runner"
    state: absent

- name: "append runner to '{{ forgejo_runner_controller.hostname }}'"
  when:
    - not running_in_check_mode
    - forgejo_runner_version is version_compare('10', '<')
    # - forgejo_runner_config.state.changed | default('false') | bool
    # depends on runner version
  become_user: "{{ forgejo_runner_system_user }}"
  become: true
  bodsch.scm.forgejo_runner:
    command: create_runner
    working_dir: "{{ forgejo_runner_working_dir }}"
    runners: "{{ forgejo_runner_register | default([]) }}"
  notify:
    - restart forgejo-runner

- name: restart forgejo-runner if needed
  when:
    - not running_in_check_mode
  ansible.builtin.meta: flush_handlers

- name: check if forgejo-runner are available
  when:
    - not running_in_check_mode
  ansible.builtin.wait_for:
    path: /run/forgejo-runner/forgejo-runner.pid
    state: present
    delay: 2
    msg: "Timeout to find /run/forgejo-runner/forgejo-runner.pid"
  ignore_errors: false

...
