---

- name: flush handlers
  when:
    - not running_in_check_mode
  ansible.builtin.meta: flush_handlers

- name: ensure opengist is enabled on boot
  become: true
  when:
    - not running_in_check_mode
  ansible.builtin.service:
    name: opengist
    state: "{{ opengist_system_service.state | default('started') }}"
    enabled: "{{ opengist_system_service.enabled | default(true) | bool }}"


...
