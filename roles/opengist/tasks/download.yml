---

- name: define download information
  when:
    - not running_in_check_mode
  ansible.builtin.set_fact:
    opengist_release: "{{ opengist_defaults_release | combine(opengist_release, recursive=True) }}"
  no_log: true

- name: resolve opengist release
  when:
    - not running_in_check_mode
  become: false
  delegate_to: localhost
  run_once: true
  bodsch.scm.scm_release:
    provider: "{{ opengist_release.provider }}"
    host: "{{ opengist_release.host }}"
    project: "{{ opengist_release.project }}"
    repository: "{{ opengist_release.repository }}"
    version: "{{ opengist_version }}"
    architecture: "{{ system_architecture }}"
    system: "{{ ansible_facts.system }}"
    user: "{{ _opengist_scm_user | default(omit, true) }}"
    password: "{{ _opengist_scm_token | default(omit, true) }}"
  register: _opengist_release

- name: re-define opengist_version
  when:
    - not running_in_check_mode
    - opengist_version == "latest"
    - _opengist_release.version is defined
    - _opengist_release.version | length > 0
  ansible.builtin.set_fact:
    opengist_version: "{{ _opengist_release.version }}"

- name: define delegate instance for download handling
  when:
    - not running_in_check_mode
    - opengist_direct_download
  ansible.builtin.set_fact:
    opengist_delegate_to: "{{ ansible_facts.host }}"
    opengist_local_tmp_directory: "{{
      lookup('env', 'CUSTOM_LOCAL_TMP_DIRECTORY') |
      default('/var/cache/ansible/opengist', true) }}/{{ opengist_version }}"

- name: create download directory
  when:
    - not running_in_check_mode
  become: false
  delegate_to: "{{ opengist_delegate_to }}"
  run_once: "{{ 'false' if opengist_direct_download else 'true' }}"
  ansible.builtin.file:
    path: "{{ opengist_local_tmp_directory }}"
    state: directory
    mode: "0700"
  check_mode: false

- name: detect the downloaded opengist archive
  when:
    - not running_in_check_mode
  become: false
  delegate_to: "{{ opengist_delegate_to }}"
  run_once: "{{ 'false' if opengist_direct_download else 'true' }}"
  ansible.builtin.stat:
    path: "{{ opengist_local_tmp_directory }}/{{ _opengist_release.file }}"
  register: opengist_stat_archive

- name: download
  when:
    - not running_in_check_mode
    - opengist_stat_archive.stat is defined
    - not opengist_stat_archive.stat.exists | default(false) | bool
  block:
    - name: download opengist binary archive
      become: false
      delegate_to: "{{ opengist_delegate_to }}"
      run_once: "{{ 'false' if opengist_direct_download else 'true' }}"
      ansible.builtin.get_url:
        url: "{{ _opengist_release.download_url }}"
        url_username: "{{ _opengist_scm_user | default(omit, true) }}"
        url_password: "{{ _opengist_scm_token | default(omit, true) }}"
        dest: "{{ opengist_local_tmp_directory }}/{{ _opengist_release.file }}"
        checksum: "{{ _opengist_release.checksum_string | default(omit) }}"
        mode: "0640"
      register: _download_archive
      until: _download_archive is succeeded
      retries: 5
      delay: 2
      check_mode: false

  rescue:
    - name: delete download directory
      become: false
      delegate_to: "{{ opengist_delegate_to }}"
      run_once: "{{ 'false' if opengist_direct_download else 'true' }}"
      ansible.builtin.file:
        path: "{{ opengist_local_tmp_directory }}"
        state: absent

    - name: exit with fail
      ansible.builtin.fail:
        msg: A serious error occurred when downloading the archive.

- name: detect downloaded file
  when:
    - not running_in_check_mode
  become: false
  delegate_to: "{{ opengist_delegate_to }}"
  run_once: "{{ 'false' if opengist_direct_download else 'true' }}"
  ansible.builtin.stat:
    path: "{{ opengist_local_tmp_directory }}/{{ _opengist_release.file }}"
  register: opengist_stat_archive

- name: detect extracted binary
  when:
    - not running_in_check_mode
  become: false
  delegate_to: "{{ opengist_delegate_to }}"
  run_once: "{{ 'false' if opengist_direct_download else 'true' }}"
  ansible.builtin.stat:
    path: "{{ opengist_local_tmp_directory }}/{{ opengist_release.binary }}"
  register: opengist_stat_binary

- name: extract opengist archive
  when:
    - not running_in_check_mode
    - opengist_stat_archive.stat is defined
    - opengist_stat_archive.stat.exists | default('false') | bool
    - opengist_stat_archive.stat.mimetype in ["application/zip","application/gzip"]
    - opengist_stat_binary.stat is defined
    - not opengist_stat_binary.stat.exists | default('false') | bool
  become: false
  delegate_to: "{{ opengist_delegate_to }}"
  run_once: "{{ 'false' if opengist_direct_download else 'true' }}"
  ansible.builtin.unarchive:
    src: "{{ opengist_local_tmp_directory }}/{{ _opengist_release.file }}"
    dest: "{{ opengist_local_tmp_directory }}/"
    remote_src: "{{ 'true' if opengist_direct_download else 'false' }}"
    extra_opts:
      - --strip-components=1

...
